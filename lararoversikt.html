
<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Läraröversikt – Historiaquiz</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f2f5fb;
      color: #17243b;
    }

    header {
      background: #142b4b;
      color: white;
      padding: 25px 30px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 27px;
    }

    header p {
      margin: 8px 0 0;
      color: #d3e0f2;
    }

    main {
      max-width: 1100px;
      margin: 45px auto;
      padding: 0 20px;
    }

    .panel {
      background: white;
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 12px 35px rgba(20, 43, 75, 0.1);
    }

    .login {
      max-width: 440px;
      margin: 65px auto;
    }

    h2 {
      margin-top: 0;
      font-size: 26px;
    }

    .muted {
      color: #627187;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 20px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #bfcbda;
      border-radius: 10px;
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid #8bb5ff;
      border-color: #2256ae;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: #2256ae;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #183f83;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .login button {
      width: 100%;
      margin-top: 24px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .secondary {
      background: #e8eef8;
      color: #183f83;
    }

    .secondary:hover {
      background: #d5e2f7;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin: 25px 0;
    }

    .stat {
      padding: 20px;
      background: #f5f8fd;
      border: 1px solid #e1e9f4;
      border-radius: 12px;
    }

    .stat strong {
      display: block;
      margin-top: 8px;
      font-size: 30px;
    }

    .toolbar {
      margin: 25px 0 18px;
    }

    .toolbar input {
      max-width: 350px;
    }

    .tablewrap {
      overflow-x: auto;
      border: 1px solid #e1e7f0;
      border-radius: 12px;
    }

    table {
      width: 100%;
      min-width: 700px;
      border-collapse: collapse;
    }

    th, td {
      padding: 14px;
      text-align: left;
      border-bottom: 1px solid #e8edf4;
      font-size: 14px;
    }

    th {
      background: #f5f8fc;
      color: #41516a;
    }

    .pill {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      background: #fff0d5;
      color: #85530a;
      font-size: 12px;
      font-weight: bold;
    }

    .pill.done {
      background: #dcf6e7;
      color: #17683a;
    }

    .message {
      min-height: 24px;
      margin-top: 16px;
      font-size: 14px;
    }

    .error {
      color: #a52727;
    }

    .ok {
      color: #17683a;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 650px) {
      main {
        margin: 25px auto;
      }

      .panel {
        padding: 22px;
      }

      .login {
        margin: 25px auto;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      header h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Historiaquiz · Läraröversikt</h1>
    <p>Registrerade genomföranden – endast för behöriga lärare</p>
  </header>

  <main>

    <!-- INLOGGNING -->
    <section id="loginView" class="panel login">
      <h2>Välkommen tillbaka</h2>

      <p class="muted">
        Logga in med ditt lärarkonto.
      </p>

      <form id="loginForm">
        <label for="email">E-postadress</label>
        <input
          id="email"
          type="email"
          autocomplete="username"
          placeholder="namn@skola.se"
          required
        >

        <label for="password">Lösenord</label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
        >

        <button id="loginButton" type="submit">
          Logga in
        </button>
      </form>

      <p id="loginMessage" class="message" role="status"></p>
    </section>

    <!-- LÄRARÖVERSIKT -->
    <section id="dashboard" class="panel" hidden>

      <div class="top">
        <div>
          <h2>Elevregistreringar</h2>
          <p id="signedIn" class="muted"></p>
        </div>

        <div class="actions">
          <button id="refresh" class="secondary">
            Uppdatera
          </button>

          <button id="logout" class="secondary">
            Logga ut
          </button>
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          Totalt registrerade
          <strong id="total">0</strong>
        </div>

        <div class="stat">
          Avslutade
          <strong id="completed">0</strong>
        </div>

        <div class="stat">
          Påbörjade
          <strong id="started">0</strong>
        </div>
      </div>

      <div class="toolbar">
        <label for="search">Sök elev eller klass</label>
        <input
          id="search"
          type="search"
          placeholder="Skriv ett namn eller en klass..."
        >
      </div>

      <div class="tablewrap">
        <table>
          <thead>
            <tr>
              <th>Elev</th>
              <th>Klass</th>
              <th>Startad</th>
              <th>Avslutad</th>
              <th>Status</th>
              <th>Kvitto</th>
            </tr>
          </thead>

          <tbody id="rows"></tbody>
        </table>
      </div>

      <p id="dashboardMessage" class="message" role="status"></p>

    </section>

  </main>

  <script type="module">
    import { createClient } from
      'https://esm.sh/@supabase/supabase-js@2';

    // DINA SUPABASE-UPPGIFTER ÄR REDAN IFYLLDA
    const SUPABASE_URL =
      'https://wursrnumwoojxiqdmaud.supabase.co';

    const SUPABASE_PUBLISHABLE_KEY =
      'sb_publishable_DGESxEHdTyh93DJuKczjZg_PABMLcEq';

    const client = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const $ = id => document.getElementById(id);

    let attempts = [];

    function date(value) {
      if (!value) return '–';

      return new Date(value).toLocaleString('sv-SE', {
        dateStyle: 'short',
        timeStyle: 'short'
      });
    }

    function message(id, text, error = false) {
      const element = $(id);
      element.textContent = text;
      element.className =
        'message ' + (error ? 'error' : 'ok');
    }

    function showLogin() {
      $('loginView').hidden = false;
      $('dashboard').hidden = true;
    }

    function showDashboard(email) {
      $('loginView').hidden = true;
      $('dashboard').hidden = false;
      $('signedIn').textContent =
        'Inloggad som ' + email;
    }

    function addCell(row, value) {
      const cell = document.createElement('td');
      cell.textContent = value;
      row.appendChild(cell);
      return cell;
    }

    function render() {
      const query = $('search').value
        .trim()
        .toLocaleLowerCase('sv');

      const filtered = attempts.filter(a =>
        (
          (a.student_name || '') + ' ' +
          (a.class_name || '')
        )
        .toLocaleLowerCase('sv')
        .includes(query)
      );

      $('total').textContent = attempts.length;

      $('completed').textContent =
        attempts.filter(a => a.completed_at).length;

      $('started').textContent =
        attempts.filter(a => !a.completed_at).length;

      $('rows').replaceChildren();

      for (const attempt of filtered) {
        const row = document.createElement('tr');

        addCell(row, attempt.student_name || '–');
        addCell(row, attempt.class_name || '–');
        addCell(row, date(attempt.started_at));
        addCell(row, date(attempt.completed_at));

        const statusCell = addCell(row, '');

        const badge = document.createElement('span');
        badge.className =
          'pill ' + (attempt.completed_at ? 'done' : '');

        badge.textContent =
          attempt.completed_at
            ? 'Avslutad'
            : 'Påbörjad';

        statusCell.appendChild(badge);

        addCell(row, attempt.receipt || '–');

        $('rows').appendChild(row);
      }

      if (filtered.length === 0) {
        const row = document.createElement('tr');
        const cell = document.createElement('td');

        cell.colSpan = 6;
        cell.textContent =
          'Inga registreringar att visa.';

        row.appendChild(cell);
        $('rows').appendChild(row);
      }
    }

    async function load() {
      message(
        'dashboardMessage',
        'Hämtar registreringar...'
      );

      try {
        const { data, error } =
          await client.auth.getSession();

        if (error || !data.session) {
          throw new Error(
            'Du måste logga in igen.'
          );
        }

        const response = await fetch(
          SUPABASE_URL + '/functions/v1/quiz-api',
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'apikey': SUPABASE_PUBLISHABLE_KEY,
              'Authorization':
                'Bearer ' + data.session.access_token
            },
            body: JSON.stringify({
              action: 'teacher-list'
            })
          }
        );

        const result = await response.json();

        if (!response.ok) {
          throw new Error(
            result.error ||
            'Kunde inte hämta registreringar.'
          );
        }

        attempts = result.attempts || [];

        render();

        message(
          'dashboardMessage',
          attempts.length + ' registreringar hämtade.'
        );

      } catch (error) {
        message(
          'dashboardMessage',
          error.message,
          true
        );
      }
    }

    $('loginForm').addEventListener(
      'submit',
      async event => {
        event.preventDefault();

        const button = $('loginButton');
        button.disabled = true;

        message(
          'loginMessage',
          'Loggar in...'
        );

        try {
          const { data, error } =
            await client.auth.signInWithPassword({
              email: $('email').value.trim(),
              password: $('password').value
            });

          if (error) {
            throw error;
          }

          $('password').value = '';

          showDashboard(data.user.email);

          await load();

        } catch (error) {
          message(
            'loginMessage',
            'Inloggningen misslyckades: ' +
              error.message,
            true
          );

        } finally {
          button.disabled = false;
        }
      }
    );

    $('refresh').addEventListener('click', load);

    $('search').addEventListener('input', render);

    $('logout').addEventListener(
      'click',
      async () => {
        await client.auth.signOut();

        attempts = [];

        showLogin();

        message(
          'loginMessage',
          'Du är utloggad.'
        );
      }
    );

    client.auth.getSession().then(
      async ({ data }) => {
        if (data.session) {
          showDashboard(data.session.user.email);
          await load();
        }
      }
    );
  </script>

</body>
</html>
